services:
  redis:
    build:
      context: ./redis-setup
      dockerfile: Dockerfile
      args:
        REDIS_PASSWORD: ${REDIS_PASSWORD}
    container_name: attendance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-app
    ports:
      - "8443:8443"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
