worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # -----------------------------
    # Performance
    # -----------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 1000;

    # -----------------------------
    # GZIP
    # -----------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml
        application/xml+rss;

    # -----------------------------
    # Logging
    # -----------------------------
    log_format safe '$remote_addr - [$time_local] '
                    '"$request_method $uri" $status $body_bytes_sent '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log safe;

    # -----------------------------
    # CORS Origin Allowlist
    # -----------------------------
    map $http_origin $cors_allow_origin {
        default $http_origin;
        "http://localhost:5173" $http_origin;
        "https://attendez.buildapp.in" $http_origin;
        "https://attendance.buildapp.in" $http_origin;
    }

    # -----------------------------
    # Rate limiting (per IP)
    # -----------------------------
    limit_req_zone $binary_remote_addr zone=rate_limit_zone:10m rate=30r/s;

    upstream spring_backend {
        server app:8080;
        keepalive 64;
    }
    upstream fastapi_backend {
            server fastapi-app:8000;
            keepalive 64;
    }

    server {
        listen 0.0.0.0:80;

        # Rate limit everything
        limit_req zone=rate_limit_zone burst=40 nodelay;

        # -----------------------------
        # Hard blocks
        # -----------------------------
        location ~* ^/(swagger-ui|v3/api-docs)/ {
            return 403;
        }

        location ~* ^/(\.git|\.env|\.DS_Store|docker-compose\.yml) {
            return 403;
        }

        # Optional: block static file leaks
        location ~* \.(html|css|js|png|jpe?g|gif|ico|svg|woff2?|ttf|eot)$ {
            return 403;
        }

        # -----------------------------
        # Main API Proxy
        # -----------------------------
        location / {

            # Preflight (OPTIONS)
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' "$cors_allow_origin" always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://spring_backend;
            proxy_http_version 1.1;

            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;

            proxy_buffering on;
            proxy_buffers 16 16k;
            proxy_buffer_size 16k;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward auth header
            proxy_set_header Authorization $http_authorization;

            # CORS actual response
            add_header 'Access-Control-Allow-Origin' "$cors_allow_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            # Basic security headers
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;

            limit_except GET POST DELETE OPTIONS {
                deny all;
            }
        }

        location = /api2 {
                    return 302 /api2/;
                }
       # -----------------------------
           # 2. FastAPI Backend (Consolidated)
           # -----------------------------
           location /api2/ {
               # 1. Handle Preflight (OPTIONS) immediately
               # This prevents the 405 error by stopping the request here
               if ($request_method = OPTIONS) {
                   add_header 'Access-Control-Allow-Origin' "$cors_allow_origin" always;
                   add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                   add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                   add_header 'Access-Control-Allow-Credentials' 'true' always;
                   add_header Content-Length 0;
                   add_header Content-Type text/plain;
                   return 204;
               }

               # 2. Rewrite URL (Strip /api2)
               rewrite ^/api2/(.*)$ /$1 break;

               # 3. Send to Backend
               proxy_pass http://fastapi_backend;
               proxy_http_version 1.1;
               proxy_set_header Host $host;
               proxy_set_header X-Real-IP $remote_addr;
               proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
               proxy_set_header X-Forwarded-Proto $scheme;

               # 4. Add CORS headers to the actual backend response
               add_header 'Access-Control-Allow-Origin' "$cors_allow_origin" always;
               add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
               add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
               add_header 'Access-Control-Allow-Credentials' 'true' always;
           }


    }
}
