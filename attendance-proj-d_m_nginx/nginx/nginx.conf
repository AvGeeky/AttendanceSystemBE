# NGINX configuration for secure reverse proxying to Spring Boot app
# Features: CORS, JWT-safe, rate limiting, no static file leaks

worker_processes auto;

events {
    worker_connections 1024;  # Max concurrent connections per worker
}


http {

    gzip on;
    gzip_types application/json;
    gzip_min_length 256;

    sendfile on;
    keepalive_timeout 65;

    # Safe log format: no JWTs, query params, or sensitive info
    log_format safe '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri" $status $body_bytes_sent '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log safe;

    # Rate limit zone: 5 requests/second/IP
    limit_req_zone $binary_remote_addr zone=rate_limit_zone:10m rate=5r/s;

    server {
        listen 80;

        # Apply global rate limiting
        limit_req zone=rate_limit_zone burst=10 nodelay;




        # --- Block external access to Swagger / OpenAPI ---
        location ~* ^/(swagger-ui|v3/api-docs)/ {
            return 403;
        }

        # --- Block static file access just in case ---
        location ~* \.(html|css|js|png|jpe?g|gif|ico|svg|woff2?|ttf|eot)$ {
            return 403;
        }

        # --- Main reverse proxy to Spring Boot backend ---
        location / {
            proxy_pass http://app:8443;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;

            # Preserve headers and real client info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            # --- CORS Handling ---
            # Uncomment and restrict later if needed:
            # add_header Access-Control-Allow-Origin "https://portal.attendez.in" always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

            # Handle CORS preflight (OPTIONS) requests
            if ($request_method = OPTIONS) {
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # Restrict to only these HTTP methods
            limit_except GET POST DELETE OPTIONS {
                deny all;
            }
        }
    }
}
