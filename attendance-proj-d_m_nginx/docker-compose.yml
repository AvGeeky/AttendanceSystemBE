services:
  redis:
    build:
      context: ./redis-setup
      dockerfile: Dockerfile
      args:
        REDIS_PASSWORD: ${REDIS_PASSWORD}
    container_name: attendance-redis-v3
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks: [backend]

  mongodb:
    build:
      context: ./mongo-setup
      dockerfile: Dockerfile
    container_name: attendance-mongo-v3
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test: [ "CMD", "mongosh", "--username", "${MONGO_USERNAME}", "--password", "${MONGO_PASSWORD}", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [backend]

  app:
    build:
      context: ./springBoot
      dockerfile: Dockerfile
    container_name: attendance-app-v3
    expose:
      - "8080"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks: [backend]

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: attendance-nginx-v3
    ports:
      - "80:80"   # Maps port 80 of the host to port 80 of the nginx container for HTTP traffic
    depends_on:
      - app
    networks: [backend]

  cloudflared:
    build:
      context: ./cloudflared
      dockerfile: Dockerfile
    container_name: attendance-cloudflared-v3
    depends_on:
      - nginx
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_KEY}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_KEY}
    networks: [ backend ]

volumes:
  redis-data:
  mongo-data:
networks:
  backend:
